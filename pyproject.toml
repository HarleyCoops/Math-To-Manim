[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-to-manim"
version = "1.1.0"
description = "Ask a question -> get a visual explainer. The Grok 4.6 chain turns one sentence into a cinematic Manim film."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christian H. Cooper" }]
keywords = ["manim", "animation", "mathematics", "grok", "xai", "agents"]
dependencies = [
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=2.0,<3",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
mcp = [
  "mcp>=2.0,<3",
]
render = [
  "manim>=0.19",
]
grok = [
  "httpx>=0.27",
]

[project.scripts]
math-to-manim = "mythos.cli:main"
m2m = "mythos.cli:main"
math-to-manim-sol = "sol.cli:main"
m2m-sol = "sol.cli:main"
math-to-manim-grok = "grok.cli:main"
m2m-grok = "grok.cli:main"

[project.urls]
Homepage = "https://github.com/HarleyCoops/Math-To-Manim"
Repository = "https://github.com/HarleyCoops/Math-To-Manim"

[tool.setuptools.packages.find]
include = ["mythos*", "sol*", "grok*"]

[tool.setuptools.package-data]
mythos = ["agents/*.md"]
grok = ["agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
