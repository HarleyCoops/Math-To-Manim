[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-to-manim"
version = "2.0.0"
description = "Astra-native mathematical films with independent jev review at every reasoning and rendering step."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christian H. Cooper" }]
keywords = ["manim", "animation", "mathematics", "astra", "codex", "agents"]
dependencies = [
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=2.0,<3",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
mcp = [
  "mcp>=2.0,<3",
]
render = [
  "manim>=0.19",
]
grok = [
  "httpx>=0.27",
]

[project.scripts]
math-to-manim = "astra.cli:main"
math-to-manim-astra = "astra.cli:main"
math-to-manim-mythos = "mythos.cli:main"
m2m = "astra.cli:main"
math-to-manim-sol = "sol.cli:main"
m2m-sol = "sol.cli:main"
math-to-manim-grok = "grok.cli:main"
m2m-grok = "grok.cli:main"
math-to-manim-glm = "glm.cli:main"
m2m-glm = "glm.cli:main"
math-to-manim-mimo = "mimo.cli:main"
m2m-mimo = "mimo.cli:main"

[project.urls]
Homepage = "https://github.com/HarleyCoops/Math-To-Manim"
Repository = "https://github.com/HarleyCoops/Math-To-Manim"

[tool.setuptools.packages.find]
include = ["astra*", "mythos*", "sol*", "grok*", "glm*", "mimo*"]

[tool.setuptools.package-data]
astra = ["*.mjs"]
mythos = ["agents/*.md"]
grok = ["agents/*.md"]
glm = ["agents/*.md"]
mimo = ["agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
