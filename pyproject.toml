[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-to-manim"
version = "2.0.0"
description = "Astra-native mathematical films through the Codex SDK, with independent evidence audits and optional Jev review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christian H. Cooper" }]
keywords = ["manim", "animation", "mathematics", "astra", "codex", "agents"]
dependencies = [
  "pydantic>=2,<3",
  "typesafe-sdk==0.7.5",
]

[project.optional-dependencies]
astra = [
  "manim>=0.19,<0.20",
  "mcp>=2.0,<3",
]
dev = [
  "pytest>=8",
  "tomli>=2; python_version < '3.11'",
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=2.0,<3",
  "math-to-manim[argon]",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
mcp = [
  "mcp>=2.0,<3",
]
render = [
  "manim>=0.19",
]
studio = [
  "manim>=0.22,<0.23",
  "claude-agent-sdk>=0.2.180",
]
grok = [
  "httpx>=0.27",
]
argon = [
  "google-adk>=2.4",
  "google-genai>=2.0",
  "numpy>=1.26",
]

[project.scripts]
math-to-manim = "astra.cli:main"
math-to-manim-astra = "astra.cli:main"
math-to-manim-mythos = "mythos.cli:main"
m2m = "astra.cli:main"
math-to-manim-sol = "sol.cli:main"
m2m-sol = "sol.cli:main"
math-to-manim-grok = "grok.cli:main"
m2m-grok = "grok.cli:main"
math-to-manim-glm = "glm.cli:main"
m2m-glm = "glm.cli:main"
math-to-manim-mimo = "mimo.cli:main"
m2m-mimo = "mimo.cli:main"
math-to-manim-argon = "argon.cli:main"
m2m-argon = "argon.cli:main"
math-to-manim-studio = "studio.cli:main"
m2m-studio = "studio.cli:main"

[project.urls]
Homepage = "https://github.com/HarleyCoops/Math-To-Manim"
Repository = "https://github.com/HarleyCoops/Math-To-Manim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astra = ["*.mjs", "node/*.json"]
mythos = ["agents/*.md"]
studio = ["agents/*.md", "examples/*.json"]
grok = ["agents/*.md"]
glm = ["agents/*.md"]
mimo = ["agents/*.md"]
argon = ["agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
