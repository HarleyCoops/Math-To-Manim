# Base44 dev runbook for Math-To-Manim.
# Serves the interactive lesson and curated film on host port 3000.
# Film production runs separately through the authenticated Codex CLI.
services:
  api:
    image: python:3.12-slim
    working_dir: /app
    environment:
      # Local-infra/config only; no external secrets required to boot the API.
      - M2M_RUNS_DIR=/app/runs
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    volumes:
      # Bind-mount the cloned source so edits appear live (uvicorn --reload).
      - .:/app
    ports:
      - "3000:3000"
    command: >
      bash -lc "
      pip install -e '.[api]' &&
      exec uvicorn deployment.app:app --host 0.0.0.0 --port 3000 --reload
      "
    restart: unless-stopped
