name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile package
        run: python -m compileall -q mythos

      - name: Check CLI help
        run: |
          math-to-manim --version
          math-to-manim run --help
          math-to-manim serve-api --help
          math-to-manim serve-mcp --help
          math-to-manim runs --help

      - name: Offline chain smoke (no model calls)
        run: |
          math-to-manim run "Explain why derivatives are slopes" --offline
          math-to-manim runs --limit 3

      - name: API boots and answers /health
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from mythos.api import app
          body = TestClient(app).get("/health").json()
          assert body["status"] == "ok", body
          print("health:", body)
          PY

      - name: MCP server registers all tools
        run: |
          python - <<'PY'
          import asyncio
          from mythos.mcp_server import mcp
          tools = asyncio.run(mcp.list_tools())
          names = sorted(t.name for t in tools)
          assert len(names) >= 7, names
          print("tools:", names)
          PY

  render-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev texlive-latex-base texlive-latex-extra dvisvgm

      - name: Install render package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,render]"

      - name: Offline chain with a real low-quality render
        run: math-to-manim run "Explain why derivatives are slopes" --offline --render -q l
