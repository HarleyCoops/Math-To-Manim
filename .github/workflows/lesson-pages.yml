name: Deploy geometry lesson
on:
  push:
    branches: [main]
    paths: ['web/**', 'docs/showcase/assets/the-third-side*', 'scripts/build_lesson_site.py', '.github/workflows/lesson-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lesson-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/build_lesson_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/lesson
      - uses: actions/deploy-pages@v5
        id: deployment
