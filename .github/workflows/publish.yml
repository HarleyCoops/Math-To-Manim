name: Publish to PyPI

# Versioned software releases publish through PyPI Trusted Publishing (OIDC).
# Film releases do not publish Python packages. Manual runs only build by default.
# One-time setup on pypi.org (no tokens, no secrets):
#   Account -> Publishing -> Add a new pending publisher
#     PyPI project name : math-to-manim
#     Owner             : HarleyCoops
#     Repository        : Math-To-Manim
#     Workflow          : publish.yml
#     Environment       : pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish to PyPI (requires the matching vVERSION tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check software release version
        if: github.event_name == 'release' || inputs.publish_to_pypi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match package version'
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the wheel
        run: |
          python scripts/check_astra_distribution.py dist/*.whl

      - name: Retrieve the verified Quasi-Riemann film
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download quasi-riemann-film-2026-10-07 --repo "$GITHUB_REPOSITORY" --pattern 'quasi-riemann-*' --dir build/film

      - name: Install film inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build the Astra bundle and checksums
        run: python scripts/build_astra_bundle.py --dist dist --film-dir build/film

      - name: Attach distributions to the software release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) || inputs.publish_to_pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/math-to-manim
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Prepare Python packages for PyPI
        run: |
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
          attestations: true
