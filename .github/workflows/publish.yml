name: Publish to PyPI

# Publishes on every GitHub release via PyPI Trusted Publishing (OIDC).
# One-time setup on pypi.org (no tokens, no secrets):
#   Account -> Publishing -> Add a new pending publisher
#     PyPI project name : math-to-manim
#     Owner             : HarleyCoops
#     Repository        : Math-To-Manim
#     Workflow          : publish.yml
#     Environment       : pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          math-to-manim --version
          math-to-manim run "wheel smoke: the pythagorean theorem" --offline

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/math-to-manim
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
